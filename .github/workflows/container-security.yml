name: Container Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  container-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t secure-container-pipeline:${{ github.sha }} .
