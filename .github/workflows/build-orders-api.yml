name: build-orders-api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/orders-api/**"
      - ".github/workflows/build-orders-api.yml"
  pull_request:
    paths:
      - "services/orders-api/**"
      - ".github/workflows/build-orders-api.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY_URL: ${{ secrets.ECR_REPOSITORY_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Build image
        working-directory: services/orders-api
        run: docker build -t "$ECR_REPOSITORY_URL:${GITHUB_SHA::7}" .

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Log in to ECR
        if: github.event_name != 'pull_request'
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URL%%/*}"

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$ECR_REPOSITORY_URL:${GITHUB_SHA::7}"
